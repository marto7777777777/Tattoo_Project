# Build and deploy InkRoute ASP.NET Core backend to Azure App Service

name: Build and deploy ASP.NET Core app to Azure Web App - inkroute-api-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_PATH: Tattoo_Project_BackEnd/Tattoo_Project/Tattoo_Project.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build backend
        run: >
          dotnet build "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-restore

      - name: Publish backend
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_PATH }}"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6BF876B4AC3849F8894AEDA131002560 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_954582D245D540E7A9889DA9D186B151 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6887BD1BDB04A4883E0094DE64A8C7A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: inkroute-api-prod
          slot-name: Production
          package: deployment
