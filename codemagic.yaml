workflows:
  inkroute-ios:
    name: InkRoute iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Ink Route

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inkroute.app
      node: 22
      xcode: latest

    scripts:
      - name: Install frontend dependencies
        script: |
          cd Tattoo_Project_FrontEnd
          npm ci

      - name: Build web app
        script: |
          cd Tattoo_Project_FrontEnd
          npm run build

      - name: Sync Capacitor iOS
        script: |
          cd Tattoo_Project_FrontEnd
          npx cap sync ios

      - name: Apply iOS signing
        script: |
          cd Tattoo_Project_FrontEnd
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd Tattoo_Project_FrontEnd/ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - Tattoo_Project_FrontEnd/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration